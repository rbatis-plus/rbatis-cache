[package]
name = "rbatis-cache"
version = "0.1.0-alpha.2"
edition = "2024"
rust-version = "1.97"
description = "Second-level cache SPI and safe interception semantics for RBatis"
license = "MIT OR Apache-2.0"
repository = "https://github.com/rbatis-plus/rbatis-cache"
homepage = "https://github.com/rbatis-plus/rbatis-cache"
keywords = ["rbatis", "cache", "database", "orm"]
categories = ["caching", "database"]

[dependencies]
blake3 = "1.8.5"
dashmap = "6.1"
futures = "0.3"
rmp-serde = "1.3.1"
serde = { version = "1", features = ["derive"] }
sqlparser = { version = "0.62.0", features = ["visitor"] }
thiserror = "2"
tokio = { version = "1", features = ["sync", "time"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unused_must_use = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
return_self_not_must_use = "allow"
