# CI for rbatis-cache workspace.
#
# 矩阵：ubuntu/macOS/windows。
# 步骤：fmt -> clippy(workspace, -D warnings) -> test(workspace) -> doc(workspace)。
#
# 注：本地开发使用 `[patch]` 覆盖 rbatis 为 path；CI 上若 rbatis
# 分支已推送，依赖会从 git 解析。

name: ci

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: clippy,rustfmt
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # 仅跑本地契约测试；分布式 backend（redis/memcached）的契约依赖
      # 真实服务，由各 backend 的 README 文档说明在测试容器中启动的方式。
      - run: cargo test --workspace --lib --tests --test cache_contract --test local_backend_contract
      - run: cargo doc --workspace --all-features --no-deps