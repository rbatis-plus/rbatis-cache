[package]
name = "rbatis-cache-moka"
version = "0.1.0-alpha.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Moka in-process backend for rbatis-cache (Java analog: Caffeine adapter)"
keywords = ["rbatis", "moka", "cache", "database"]
categories = ["caching", "database"]

[dependencies]
rbatis-cache = { version = "0.1.0-alpha.2", path = ".." }
blake3.workspace = true
moka = { version = "0.12", features = ["future"] }
async-trait = "0.1"
futures.workspace = true
log.workspace = true
tokio = { workspace = true, features = ["sync", "time"] }

[dev-dependencies]
# 复用 rbatis-cache 的 backend 契约测试 harness
rbatis-cache = { path = "..", features = ["testing"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
